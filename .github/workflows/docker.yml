name: Build and publish Docker image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore
        run: dotnet restore Fusion360Mcp.sln

      - name: Build
        run: dotnet build Fusion360Mcp.sln -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/Fusion360.Mcp.Core.Tests/Fusion360.Mcp.Core.Tests.csproj -c Release --no-build
          dotnet test tests/Fusion360.Mcp.Server.Tests/Fusion360.Mcp.Server.Tests.csproj -c Release --no-build
          python -m compileall -q addon/Fusion360MCP
          python -m unittest discover -s tests/python_addin
          python scripts/check_tool_parity.py
          python scripts/check_guards.py
      - name: Require live platform evidence for versioned image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
          grep -qx "Candidate version: $version" docs/status/e2e-stable-release.md
          grep -qx 'Status: pass' docs/status/e2e-stable-release.md
          grep -qx 'Windows: pass' docs/status/e2e-stable-release.md
          grep -qx 'macOS: pass' docs/status/e2e-stable-release.md
          python scripts/package_addin.py
          expected=$(sed -n 's/^Add-in SHA256: //p' docs/status/e2e-stable-release.md)
          actual=$(sha256sum dist/Fusion360MCP-python.zip | cut -d ' ' -f 1)
          test "$expected" = "$actual"

  image:
    name: Build and publish GHCR image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
