name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # net10.0 + netstandard2.0 + net48 builds; tests for the two net10 test suites.
  # AddIn (net48) is part of the solution build; its adsk reference is a no-op
  # glob when thirdparty/adsk/ has no DLLs, so this job never requires adsk (D3).
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - name: Restore
        run: dotnet restore Fusion360Mcp.sln
      - name: Build
        run: dotnet build Fusion360Mcp.sln -c Release --no-restore
      - name: Test (Core.Tests + Server.Tests)
        run: |
          dotnet test tests/Fusion360.Mcp.Core.Tests/Fusion360.Mcp.Core.Tests.csproj -c Release --no-build
          dotnet test tests/Fusion360.Mcp.Server.Tests/Fusion360.Mcp.Server.Tests.csproj -c Release --no-build

  # AddIn build: Windows-only, and only when adsk .NET assemblies are present
  # in thirdparty/adsk/ (D3). AddIn.Tests are intentionally skipped in CI.
  addin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - name: Detect adsk assemblies
        id: adsk
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path .\thirdparty\adsk -Filter *.dll -File -ErrorAction SilentlyContinue
          $present = $null -ne $found -and @($found).Count -gt 0
          "present=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $present) { Write-Host "thirdparty/adsk: no adsk .NET assemblies yet (T1 TODO) - skipping AddIn build." }
      - name: Build AddIn (requires adsk)
        if: steps.adsk.outputs.present == 'true'
        run: dotnet build src/Fusion360.Mcp.AddIn/Fusion360.Mcp.AddIn.csproj -c Release

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, addin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read solution version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)
          if [[ -z "$version" ]]; then
            echo "Could not read <Version> from Directory.Build.props" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish release if version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$TAG"
