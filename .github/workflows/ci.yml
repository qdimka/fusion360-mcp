name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # net10.0 + netstandard2.0 + net48 builds; tests for the two net10 test suites.
  # AddIn (net48) is part of the solution build; its adsk reference is a no-op
  # glob when thirdparty/adsk/ has no DLLs, so this job never requires adsk (D3).
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore Fusion360Mcp.sln
      - name: Build
        run: dotnet build Fusion360Mcp.sln -c Release --no-restore
      - name: Test (Core.Tests + Server.Tests)
        run: |
          dotnet test tests/Fusion360.Mcp.Core.Tests/Fusion360.Mcp.Core.Tests.csproj -c Release --no-build
          dotnet test tests/Fusion360.Mcp.Server.Tests/Fusion360.Mcp.Server.Tests.csproj -c Release --no-build
      - name: Python add-in and contract checks
        run: |
          python -m compileall -q addon/Fusion360MCP
          python -m unittest discover -s tests/python_addin -v
          python scripts/check_tool_parity.py
          python scripts/check_guards.py
          python scripts/package_addin.py

  # The legacy C# add-in stays buildable until the Python E2E gate is complete.
  addin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - name: Detect adsk assemblies
        id: adsk
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path .\thirdparty\adsk -Filter *.dll -File -ErrorAction SilentlyContinue
          $present = $null -ne $found -and @($found).Count -gt 0
          "present=$($present.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $present) { Write-Host "thirdparty/adsk: no adsk .NET assemblies yet (T1 TODO) - skipping AddIn build." }
      - name: Build AddIn (requires adsk)
        if: steps.adsk.outputs.present == 'true'
        run: dotnet build src/Fusion360.Mcp.AddIn/Fusion360.Mcp.AddIn.csproj -c Release

  python-windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release zip twice
        shell: pwsh
        run: |
          python -m unittest discover -s tests/python_addin
          python scripts/package_addin.py
          Expand-Archive dist/Fusion360MCP-python.zip (Join-Path $env:RUNNER_TEMP 'FusionMcpPackage')
          $env:FUSION_MCP_ADDINS_DIR = Join-Path $env:RUNNER_TEMP 'FusionMcpAddIns'
          $installer = Join-Path $env:RUNNER_TEMP 'FusionMcpPackage/Fusion360MCP/install-addon.ps1'
          & $installer
          & $installer
          if (-not (Test-Path (Join-Path $env:FUSION_MCP_ADDINS_DIR 'Fusion360MCP/server/command_handler.py'))) {
            throw 'Python add-in installation is incomplete'
          }

  python-macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release zip twice
        run: |
          python -m unittest discover -s tests/python_addin
          python scripts/package_addin.py
          mkdir -p "$RUNNER_TEMP/FusionMcpPackage"
          unzip -q dist/Fusion360MCP-python.zip -d "$RUNNER_TEMP/FusionMcpPackage"
          export FUSION_MCP_ADDINS_DIR="$RUNNER_TEMP/FusionMcpAddIns"
          sh "$RUNNER_TEMP/FusionMcpPackage/Fusion360MCP/install-addon.sh"
          sh "$RUNNER_TEMP/FusionMcpPackage/Fusion360MCP/install-addon.sh"
          test -f "$FUSION_MCP_ADDINS_DIR/Fusion360MCP/server/command_handler.py"
