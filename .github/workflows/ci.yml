name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # .NET 10 MCP server/Core, Python add-in, and contract tests.
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore
        run: dotnet restore Fusion360Mcp.sln
      - name: Build
        run: dotnet build Fusion360Mcp.sln -c Release --no-restore
      - name: Test (Core.Tests + Server.Tests)
        run: |
          dotnet test tests/Fusion360.Mcp.Core.Tests/Fusion360.Mcp.Core.Tests.csproj -c Release --no-build
          dotnet test tests/Fusion360.Mcp.Server.Tests/Fusion360.Mcp.Server.Tests.csproj -c Release --no-build
      - name: Python add-in and contract checks
        run: |
          python -m compileall -q addon/Fusion360MCP
          python -m unittest discover -s tests/python_addin -v
          python scripts/check_tool_parity.py
          python scripts/check_guards.py
      - name: Package candidate artifacts
        run: bash scripts/publish.sh
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-release-candidate
          path: |
            dist/*.zip
            dist/SHA256SUMS

  python-windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release zip twice
        shell: pwsh
        run: |
          python -m unittest discover -s tests/python_addin
          python scripts/package_addin.py
          Expand-Archive dist/Fusion360MCP-python.zip (Join-Path $env:RUNNER_TEMP 'FusionMcpPackage')
          $env:FUSION_MCP_ADDINS_DIR = Join-Path $env:RUNNER_TEMP 'FusionMcpAddIns'
          $installer = Join-Path $env:RUNNER_TEMP 'FusionMcpPackage/Fusion360MCP/install-addon.ps1'
          & $installer
          $target = Join-Path $env:FUSION_MCP_ADDINS_DIR 'Fusion360MCP'
          $files = @('Fusion360MCP.py', 'Fusion360MCP.manifest')
          $hashes = @{}; foreach ($file in $files) { $hashes[$file] = (Get-FileHash (Join-Path $target $file)).Hash }
          function Assert-Original {
            foreach ($file in $files) {
              if ((Get-FileHash (Join-Path $target $file)).Hash -ne $hashes[$file]) { throw "Changed: $file" }
            }
          }
          $invalid = Join-Path $env:RUNNER_TEMP 'InvalidPackage'
          Copy-Item (Split-Path $installer) $invalid -Recurse
          Set-Content (Join-Path $invalid 'Fusion360MCP.manifest') '{invalid json'
          $failed = $false
          try { & (Join-Path $invalid 'install-addon.ps1') } catch { $failed = $true }
          if (-not $failed) { throw 'Invalid manifest was accepted' }
          Assert-Original
          $global:promotionInjected = $false
          function global:Move-Item {
            param($Path, $Destination)
            if (-not $global:promotionInjected -and $Path -like '*Fusion360MCP-stage-*\Fusion360MCP') {
              $global:promotionInjected = $true
              throw 'Injected promotion failure'
            }
            Microsoft.PowerShell.Management\Move-Item -Path $Path -Destination $Destination
          }
          $failed = $false
          try { & $installer } catch { $failed = $true }
          Remove-Item Function:\global:Move-Item -Force -ErrorAction SilentlyContinue
          if (-not $failed -or -not $global:promotionInjected) { throw 'Promotion failure was not exercised' }
          Assert-Original
          & $installer
          Remove-Variable promotionInjected -Scope Global
          if (-not (Test-Path (Join-Path $env:FUSION_MCP_ADDINS_DIR 'Fusion360MCP/server/command_handler.py'))) {
            throw 'Python add-in installation is incomplete'
          }

  python-macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release zip twice
        run: |
          python -m unittest discover -s tests/python_addin
          python scripts/package_addin.py
          mkdir -p "$RUNNER_TEMP/FusionMcpPackage"
          unzip -q dist/Fusion360MCP-python.zip -d "$RUNNER_TEMP/FusionMcpPackage"
          export FUSION_MCP_ADDINS_DIR="$RUNNER_TEMP/FusionMcpAddIns"
          installer="$RUNNER_TEMP/FusionMcpPackage/Fusion360MCP/install-addon.sh"
          sh "$installer"
          target="$FUSION_MCP_ADDINS_DIR/Fusion360MCP"
          shasum -a 256 "$target/Fusion360MCP.py" "$target/Fusion360MCP.manifest" > "$RUNNER_TEMP/original-hashes"
          cp -R "$RUNNER_TEMP/FusionMcpPackage/Fusion360MCP" "$RUNNER_TEMP/InvalidPackage"
          sed -i '' 's/windows|mac/invalid/' "$RUNNER_TEMP/InvalidPackage/Fusion360MCP.manifest"
          if sh "$RUNNER_TEMP/InvalidPackage/install-addon.sh"; then exit 1; fi
          shasum -a 256 -c "$RUNNER_TEMP/original-hashes"
          mkdir "$RUNNER_TEMP/shims"
          cat > "$RUNNER_TEMP/shims/mv" <<'SHIM'
          #!/bin/sh
          case "$1" in
            */.Fusion360MCP-stage.*/Fusion360MCP) touch "$RUNNER_TEMP/promotion-failed"; exit 1 ;;
          esac
          exec /bin/mv "$@"
          SHIM
          chmod +x "$RUNNER_TEMP/shims/mv"
          if PATH="$RUNNER_TEMP/shims:$PATH" sh "$installer"; then exit 1; fi
          test -f "$RUNNER_TEMP/promotion-failed"
          shasum -a 256 -c "$RUNNER_TEMP/original-hashes"
          sh "$installer"
          test -f "$FUSION_MCP_ADDINS_DIR/Fusion360MCP/server/command_handler.py"
